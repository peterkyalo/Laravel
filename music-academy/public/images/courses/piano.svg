<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="p-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="p-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="p-key" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="90%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p-bg)"/>
  <circle cx="400" cy="200" r="140" fill="none" stroke="url(#p-gold)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="200" r="110" fill="none" stroke="url(#p-gold)" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  
  <!-- Stylized Grand Piano Keys -->
  <g transform="translate(180, 140)">
    <!-- White Keys -->
    <rect x="0" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="40" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="80" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="120" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="160" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="200" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="240" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="280" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="320" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="360" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    <rect x="400" y="0" width="40" height="150" rx="4" fill="url(#p-key)" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Black Keys -->
    <rect x="26" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="68" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="148" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="188" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="228" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="308" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="348" y="0" width="26" height="95" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  </g>
  
  <!-- Subtle Gold Wave Accents -->
  <path d="M100 370 Q 250 320 400 370 T 700 370" fill="none" stroke="url(#p-gold)" stroke-width="2" opacity="0.6"/>
  <path d="M150 390 Q 275 350 400 390 T 650 390" fill="none" stroke="url(#p-gold)" stroke-width="1" opacity="0.3"/>

  <text x="400" y="425" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">CONCERT PIANO &amp; KEYS</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="4">BARITONE VIRTUOSO SYLLABUS</text>
</svg>
